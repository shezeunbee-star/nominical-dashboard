name: 📊 Daily Data Update

on:
  schedule:
    - cron: '0 21 * * *'   # 매일 오전 6시 KST (= UTC 21:00 전날)
  workflow_dispatch:         # GitHub에서 수동 실행 버튼

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: Google 인증 파일 생성
        run: echo '${{ secrets.GOOGLE_TOKEN_JSON }}' > token.json

      - name: Meta 토큰 파일 생성
        run: echo '${{ secrets.META_ACCESS_TOKEN }}' > meta_token.txt

      - name: GA4 데이터 업데이트
        run: python ga4_to_sheets.py
        env:
          GOOGLE_TOKEN_PATH: token.json

      - name: Meta 광고 데이터 업데이트
        run: python meta_to_sheets.py
        env:
          GOOGLE_TOKEN_PATH: token.json
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
